name: Health check (daily)

# Every morning: ZERO's own traffic light on its Telegram, with the shared logic of health.yml. Read-only.
#   - GitHub Pages and failed runs of this repo (Make is checked from resumen-bolsa-reel)
on:
  schedule:
    # 07:45 Madrid: 07:15 is 05:15 UTC in summer (CEST) and 06:15 UTC in winter (CET). The "hora" job keeps
    # only the run of the right time zone and waits until 07:45 sharp (GitHub's cron often starts late).
    - cron: "15 5 * * *"
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.w.outputs.go }}
    steps:
      - id: w
        run: |
          [ "${{ github.event_name }}" = schedule ] || { echo go=true >> "$GITHUB_OUTPUT"; exit 0; }
          NOW=$(date +%s); T=$(TZ=Europe/Madrid date -d 'today 07:45' +%s); M=$(TZ=Europe/Madrid date +%H%M)
          if [ "$M" -lt 0700 ] || [ "$M" -ge 0805 ]; then echo "::notice::Madrid $M: el cron del otro horario, nada que hacer"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$NOW" -lt "$T" ] && sleep $((T - NOW))
          echo go=true >> "$GITHUB_OUTPUT"

  health:
    needs: hora
    if: needs.hora.outputs.go == 'true'
    uses: ./.github/workflows/health.yml
    with:
      label: ZERO Understands
      pages_urls: https://tuamigodelasfinanzas.github.io/zero-understands/state/rendered.json
      runs_repos: tuamigodelasfinanzas/zero-understands
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
