name: Preview render

# Renders the episode named in previews/request.txt (with the real edge-tts voices, which the sandbox can't reach)
# and commits the MP4 back to this branch under previews/. Only runs on the working branch, never on main.
on:
  push:
    branches: [claude/project-thread-vhna56]
    paths: [previews/request.txt]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q edge-tts numpy
      - name: Render
        run: |
          EP=$(head -1 previews/request.txt)
          NAME=$(basename "$(dirname "$EP")")-$(basename "$EP" .mjs)
          node src/render.mjs "$EP" "out/$NAME"
          mkdir -p "previews/$NAME"
          cp out/$NAME/*.mp4 out/$NAME/timing.json "previews/$NAME/"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews
          git commit -m "Preview render [skip ci]" && git pull --rebase && git push
