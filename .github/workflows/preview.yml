name: Preview render

# Renders the episode named in previews/request.txt (with the real edge-tts voices, which the sandbox can't reach)
# and commits the MP4 back to this branch under previews/. Only runs on the working branch, never on main.
on:
  push:
    branches: [claude/project-thread-vhna56]
    paths: [previews/request.txt]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q edge-tts numpy
      - name: Render
        run: |
          EP=$(head -1 previews/request.txt)
          NAME=$(basename "$(dirname "$EP")")-$(basename "$EP" .mjs)
          node src/render.mjs "$EP" "out/$NAME"
          mkdir -p "previews/$NAME"
          cp out/$NAME/*.mp4 out/$NAME/timing.json out/$NAME/captions.srt out/$NAME/thumb.jpg "previews/$NAME/"
      - name: Commit
        # another run may have pushed to the branch meanwhile: start from its latest state and add only our files
        run: |
          mkdir -p /tmp/keep && cp -r previews /tmp/keep/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git reset -q --hard "origin/$GITHUB_REF_NAME"
          cp -r /tmp/keep/previews .
          git add previews
          git commit -m "Preview render [skip ci]" && git push origin "HEAD:$GITHUB_REF_NAME"
